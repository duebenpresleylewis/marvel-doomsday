<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Doomsday</title>
  </head>
  <body>
    <div id="app">
      <div class="page-shell">
        <header class="topbar">
          <div class="brand-wrap" aria-label="Page title">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marvel Doomsday</span>
          </div>

          <nav class="main-nav" aria-label="Main navigation">
            <a
              href="https://github.com/duebenpresleylewis"
              target="_blank"
              rel="noreferrer"
              >GitHub</a
            >
          </nav>
        </header>

        <main class="hero" aria-label="Hero section">
          <div class="hero-overlay">
            <div class="hero-copy">
              <p class="eyebrow">Creative portfolio / product launch</p>
              <h1>Build ambitious ideas into experiences people remember.</h1>
              <p class="lede">
                A minimal starting point for your next big concept, built as a
                clean, flexible layout you can refine and style as you go.
              </p>

              <div class="hero-actions">
                <a
                  class="primary-action"
                  href="https://github.com"
                  target="_blank"
                  rel="noreferrer"
                >
                  View GitHub
                </a>
                <a class="secondary-action" href="#about">Learn more</a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
